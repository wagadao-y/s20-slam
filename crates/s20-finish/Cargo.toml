[package]
name = "s20-finish"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[dependencies]
anyhow.workspace = true
nalgebra.workspace = true
rayon.workspace = true
kiddo.workspace = true
serde.workspace = true
serde_json.workspace = true
rustc-hash = "2"
s20-io = { path = "../s20-io" }
s20-geom = { path = "../s20-geom" }
zune-jpeg = "0.5"
zune-core = "0.5"
# "std": error scopes per thread (without it they are shared, and parallel use panics)
wgpu = { version = "30.0.1", default-features = false, features = ["dx12", "wgsl", "std"] }
pollster = "0.4"
bytemuck = { version = "1.23", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation"] }
