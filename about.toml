# The licenses of the crates (and the fonts egui embeds) built into s20 and s20-gui, shown by
# `s20 licenses` and in the GUI. Regenerate after changing dependencies:
#   cargo about generate about.hbs -o THIRD-PARTY-LICENSES.txt
ignore-dev-dependencies = true
ignore-build-dependencies = true
private = { ignore = true }
targets = ["x86_64-pc-windows-msvc"]
accepted = [
    # first, so that crates under "MIT OR Apache-2.0" are listed under the shorter MIT
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Bitstream-Vera",
]

# The fonts egui embeds, each with its license file; Hack's carries the Bitstream Vera License
[epaint_default_fonts.clarify]
license = "(MIT OR Apache-2.0) AND OFL-1.1 AND Ubuntu-font-1.0 AND Bitstream-Vera"

[[epaint_default_fonts.clarify.files]]
path = "fonts/OFL.txt"
license = "OFL-1.1"
checksum = "6a73f9541c2de74158c0e7cf6b0a58ef774f5a780bf191f2d7ec9cc53efe2bf2"

[[epaint_default_fonts.clarify.files]]
path = "fonts/UFL.txt"
license = "Ubuntu-font-1.0"
checksum = "2f0015108d68627bd788d313f529c21ff4da2c2c42a5e1f3883acc83480f9002"

[[epaint_default_fonts.clarify.files]]
path = "fonts/emoji-icon-font-mit-license.txt"
license = "MIT"
checksum = "b9d2c1d909aa149996fd4c91dcb92b2362a04431640c1d200959da94caf8cde1"

[[epaint_default_fonts.clarify.files]]
